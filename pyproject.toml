[project]
name = "harness"
version = "0.1.0"
description = "Remote Selenium test harness for the KVM/VyOS/IdP deployable system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "selenium==4.49.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "allure-pytest==2.16.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyYAML==6.0.3",
    "pyotp==2.10.0",
    "httpx==0.28.1",
    "tenacity==9.1.4",
]

[project.entry-points.pytest11]
harness = "harness.pytest_plugin"

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "types-PyYAML==6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = [
    "smoke: fast end-to-end checks that the kit works at all",
    "regression: fuller functional coverage",
    "unit: offline tests of the harness itself (no kit, no Grid)",
    "app_one: tests for app_one",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "ci"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "D", "ANN", "BLE", "PL", "TID", "N", "S",
]
ignore = [
    "D105",    # magic methods
    "D107",    # __init__ (documented on the class)
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "PLR2004", # magic values in comparisons
    "PLR0913", # many arguments
    "S101",    # assert is how pytest works
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"selenium".msg = "Only harness.driver and harness.waits may import selenium (layering rule 3)."
"time.sleep".msg = "No sleeps: use an explicit wait from harness.waits (layering rule 4)."

[tool.ruff.lint.per-file-ignores]
"src/harness/driver.py" = ["TID251"]
"src/harness/waits.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "ci"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
